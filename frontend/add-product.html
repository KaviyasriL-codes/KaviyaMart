<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product - KaviyaMart</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="logo">
            KaviyaMart
        </div>

        <nav>

            <a href="seller.html">
                Dashboard
            </a>

            <a href="index.html">
                Home
            </a>

            <a href="#" id="logoutLink">
                Logout
            </a>

        </nav>

    </header>


    <!-- =========================================
         ADD PRODUCT PAGE
    ========================================== -->

    <main class="form-page">

        <div class="form-container">

            <h1>
                Add New Product
            </h1>


            <form
                id="productForm"
                enctype="multipart/form-data"
            >

                <!-- PRODUCT NAME -->

                <label for="productName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                    required
                >


                <!-- CATEGORY -->

                <label for="productCategory">
                    Category
                </label>

                <select
                    id="productCategory"
                    required
                >

                    <option value="">
                        Select category
                    </option>

                    <option value="Fashion">
                        Fashion
                    </option>

                    <option value="Watches">
                        Watches
                    </option>

                    <option value="Jewelry">
                        Jewelry
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                </select>


                <!-- PRICE -->

                <label for="productPrice">
                    Price
                </label>

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Enter price"
                    step="0.01"
                    min="0"
                    required
                >


                <!-- DESCRIPTION -->

                <label for="productDescription">
                    Description
                </label>

                <textarea
                    id="productDescription"
                    rows="5"
                    placeholder="Enter product description"
                    required
                ></textarea>


                <!-- =================================
                     IMAGE UPLOAD
                ================================== -->

                <label for="productImage">
                    Product Image
                </label>

                <input
                    type="file"
                    id="productImage"
                    name="image"
                    accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                    required
                >


                <p class="image-help">
                    Choose a JPG, PNG, JPEG or WEBP image.
                </p>


                <!-- =================================
                     IMAGE PREVIEW
                ================================== -->

                <div
                    id="imagePreview"
                    style="
                        display:none;
                        margin-top:15px;
                        text-align:center;
                    "
                >

                    <p>
                        <strong>
                            Image Preview
                        </strong>
                    </p>

                    <img
                        id="previewImage"
                        src=""
                        alt="Product Image Preview"
                        style="
                            max-width:250px;
                            max-height:250px;
                            object-fit:contain;
                            border-radius:10px;
                            margin-top:10px;
                        "
                    >

                </div>


                <!-- =================================
                     BUTTONS
                ================================== -->

                <button
                    type="submit"
                    class="btn"
                >
                    Add Product
                </button>


                <button
                    type="button"
                    class="btn"
                    onclick="window.location.href='seller.html'"
                    style="margin-top:10px;"
                >
                    Cancel
                </button>

            </form>

        </div>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
