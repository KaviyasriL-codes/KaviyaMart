<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - KaviyaMart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        KaviyaMart
    </div>

    <nav>
        <a href="seller.html">Dashboard</a>
        <a href="index.html">Home</a>
    </nav>

</header>


<main class="form-page">

    <div class="form-container">

        <h1>Add New Product</h1>


        <form id="productForm">

            <label for="productName">
                Product Name
            </label>

            <input
                type="text"
                id="productName"
                required
            >


            <label for="productCategory">
                Category
            </label>

            <select
                id="productCategory"
                required
            >

                <option value="">
                    Select category
                </option>

                <option value="Fashion">
                    Fashion
                </option>

                <option value="Watches">
                    Watches
                </option>

                <option value="Jewelry">
                    Jewelry
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Accessories">
                    Accessories
                </option>

            </select>


            <label for="productPrice">
                Price
            </label>

            <input
                type="number"
                id="productPrice"
                step="0.01"
                min="0"
                required
            >


            <label for="productDescription">
                Description
            </label>

            <textarea
                id="productDescription"
                rows="5"
                required
            ></textarea>


            <!-- IMAGE UPLOAD -->

            <label for="productImage">
                Product Image
            </label>

            <input
                type="file"
                id="productImage"
                accept="image/jpeg,image/png,image/webp"
                required
            >

            <small>
                Supported: JPG, PNG, WEBP
            </small>


            <!-- IMAGE PREVIEW -->

            <div
                id="imagePreview"
                style="
                    margin-top:15px;
                    display:none;
                "
            >

                <img
                    id="previewImage"
                    src=""
                    alt="Product Preview"
                    style="
                        width:180px;
                        height:180px;
                        object-fit:cover;
                        border-radius:10px;
                    "
                >

            </div>


            <button
                type="submit"
                class="btn"
            >
                Add Product
            </button>

        </form>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
