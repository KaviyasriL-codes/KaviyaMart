<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Seller Orders | KaviyaMart</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           KAVIYAMART SELLER ORDERS
           Theme: Violet + White + Gold
        ===================================================== */

        body
{
    background: #F5F0E6;
    color: #222;
}

        /* =====================================================
           PAGE
        ===================================================== */

        .orders-page
        {
            max-width: 1200px;

            margin: 0 auto;

            padding: 40px 20px 70px;
        }


        /* =====================================================
           PAGE HEADER
        ===================================================== */

        .orders-header
        {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }


        .orders-header h1
        {
            font-size: 34px;

            margin-bottom: 8px;

            color: #3f207f;
        }


        .orders-header p
        {
            color: #777;

            font-size: 15px;
        }


        /* =====================================================
           REFRESH BUTTON
        ===================================================== */

        .refresh-btn
        {
            border: none;

            padding: 12px 20px;

            border-radius: 12px;

            background: #6c3fc9;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        .refresh-btn:hover
        {
            background: #5427a8;

            transform: translateY(-1px);
        }


        /* =====================================================
           SUMMARY
        ===================================================== */

        .orders-summary
        {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }


        .summary-card
        {
            background: white;

            border-radius: 18px;

            padding: 22px;

            border: 1px solid #eee5ff;

            box-shadow:
                0 5px 20px
                rgba(75, 45, 130, 0.08);
        }


        .summary-card p
        {
            color: #777;

            font-size: 14px;

            margin-bottom: 8px;
        }


        .summary-card h2
        {
            font-size: 28px;

            color: #5c32ad;
        }


        /* =====================================================
           ORDER CARD
        ===================================================== */

        .seller-order-card
        {
            background: white;

            border-radius: 20px;

            margin-bottom: 24px;

            padding: 26px;

            border: 1px solid #eee5ff;

            box-shadow:
                0 6px 24px
                rgba(75, 45, 130, 0.08);
        }


        /* =====================================================
           ORDER TOP
        ===================================================== */

        .order-top
        {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            padding-bottom: 18px;

            border-bottom:
                1px solid #eee5ff;
        }


        .order-top h2
        {
            font-size: 20px;

            margin-bottom: 6px;

            color: #32175f;
        }


        .order-date
        {
            color: #888;

            font-size: 13px;
        }


        .order-type
        {
            padding: 8px 14px;

            border-radius: 20px;

            background: #f3edff;

            color: #6336b5;

            font-size: 12px;

            font-weight: 700;
        }


        /* =====================================================
           CUSTOMER
        ===================================================== */

        .customer-section
        {
            padding: 20px 0;

            border-bottom:
                1px solid #eee5ff;
        }


        .customer-section h3
        {
            font-size: 15px;

            margin-bottom: 12px;

            color: #3f207f;
        }


        .customer-info
        {
            display: flex;

            flex-wrap: wrap;

            gap: 18px;

            color: #666;

            font-size: 14px;
        }


        /* =====================================================
           DELIVERY ADDRESS
        ===================================================== */

        .delivery-box
        {
            margin-top: 15px;

            padding: 15px;

            background: #faf8ff;

            border-left:
                4px solid #6c3fc9;

            border-radius: 10px;

            color: #555;

            font-size: 14px;

            line-height: 1.6;
        }


        .delivery-box strong
        {
            color: #3f207f;
        }


        /* =====================================================
           ITEMS
        ===================================================== */

        .order-items
        {
            padding: 5px 0;
        }


        .seller-order-item
        {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 25px;

            padding: 20px 0;

            border-bottom:
                1px solid #f0ebf8;
        }


        .seller-order-item:last-child
        {
            border-bottom: none;
        }


        .item-left
        {
            display: flex;

            align-items: center;

            gap: 15px;

            flex: 1;
        }


        .item-image
        {
            width: 72px;

            height: 72px;

            border-radius: 12px;

            object-fit: cover;

            background: #f4efff;

            border: 1px solid #eadfff;
        }


        .item-info
        {
            flex: 1;
        }


        .item-info h3
        {
            font-size: 17px;

            margin-bottom: 7px;

            color: #292929;
        }


        .item-info p
        {
            color: #777;

            font-size: 13px;

            margin-bottom: 5px;
        }


        .item-price
        {
            font-size: 17px;

            font-weight: 800;

            color: #5c32ad;

            white-space: nowrap;
        }


        /* =====================================================
           ITEM STATUS AREA
        ===================================================== */

        .item-action
        {
            display: flex;

            flex-direction: column;

            align-items: flex-end;

            gap: 9px;

            min-width: 170px;
        }


        .status-label
        {
            font-size: 12px;

            font-weight: 700;

            color: #777;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }


        .item-status
        {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 800;
        }


        /* Pending */

        .item-status.pending
        {
            background: #fff6df;

            color: #9a6800;

            border:
                1px solid #f1d58a;
        }


        /* Delivered */

        .item-status.delivered
        {
            background: #e8f8ef;

            color: #167342;

            border:
                1px solid #a9dfbf;
        }


        /* =====================================================
           MARK DELIVERED BUTTON
        ===================================================== */

        .deliver-btn
        {
            border: none;

            padding: 9px 15px;

            border-radius: 10px;

            background: #6c3fc9;

            color: white;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        .deliver-btn:hover
        {
            background: #5427a8;

            transform: translateY(-1px);
        }


        .deliver-btn:disabled
        {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================================
           ORDER BOTTOM
        ===================================================== */

        .order-bottom
        {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 15px;

            padding-top: 20px;

            border-top:
                1px solid #eee5ff;
        }


        .order-bottom span
        {
            color: #777;

            font-size: 15px;
        }


        .order-bottom strong
        {
            font-size: 22px;

            color: #3f207f;
        }


        /* =====================================================
           EMPTY / LOADING
        ===================================================== */

        .empty-orders,
        .loading-box
        {
            background: white;

            border-radius: 20px;

            padding: 60px 20px;

            text-align: center;

            border: 1px solid #eee5ff;

            box-shadow:
                0 5px 20px
                rgba(75, 45, 130, 0.07);
        }


        .empty-icon
        {
            font-size: 48px;

            margin-bottom: 15px;
        }


        .empty-orders h2
        {
            margin-bottom: 10px;

            color: #3f207f;
        }


        .empty-orders p
        {
            color: #777;

            margin-bottom: 20px;
        }


        .primary-btn
        {
            display: inline-block;

            border: none;

            text-decoration: none;

            padding: 12px 22px;

            border-radius: 10px;

            background: #6c3fc9;

            color: white;

            font-weight: 700;

            cursor: pointer;
        }


        .primary-btn:hover
        {
            background: #5427a8;
        }


        .error-message
        {
            color: #c0392b;

            margin-bottom: 20px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 768px)
        {
            .orders-header
            {
                flex-direction: column;

                align-items: flex-start;
            }


            .orders-summary
            {
                grid-template-columns: 1fr;
            }


            .order-top
            {
                flex-direction: column;
            }


            .seller-order-item
            {
                flex-direction: column;

                align-items: stretch;
            }


            .item-action
            {
                align-items: flex-start;

                min-width: auto;
            }


            .item-left
            {
                align-items: flex-start;
            }


            .customer-info
            {
                flex-direction: column;

                gap: 8px;
            }
        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="logo">
        KaviyaMart
    </div>


    <nav>

        <a href="seller.html">
            Dashboard
        </a>

        <a href="add-product.html">
            Add Product
        </a>

        <a href="seller-orders.html">
            Orders
        </a>

        <a href="index.html">
            Home
        </a>

    </nav>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="orders-page">


    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <section class="orders-header">

        <div>

            <h1>
                Seller Orders
            </h1>

            <p>
                View orders and update delivery status
                for each product.
            </p>

        </div>


        <button
            class="refresh-btn"
            onclick="loadSellerOrders()"
        >
            ↻ Refresh Orders
        </button>

    </section>



    <!-- =====================================================
         SUMMARY
    ====================================================== -->

    <section
        class="orders-summary"
        id="ordersSummary"
        style="display:none;"
    >

        <div class="summary-card">

            <p>
                Total Orders
            </p>

            <h2 id="totalOrders">
                0
            </h2>

        </div>


        <div class="summary-card">

            <p>
                Products Sold
            </p>

            <h2 id="productsSold">
                0
            </h2>

        </div>


        <div class="summary-card">

            <p>
                Your Sales
            </p>

            <h2 id="totalSales">
                ₹0.00
            </h2>

        </div>

    </section>



    <!-- =====================================================
         ORDERS CONTAINER
    ====================================================== -->

    <section id="ordersContainer">

        <div class="loading-box">

            <p>
                Loading seller orders...
            </p>

        </div>

    </section>


</main>



<script>


const API_BASE = "";


// ============================================================
// GET LOGGED-IN SELLER
// ============================================================

function getLoggedInSeller()
{
    const userId =
        localStorage.getItem("user_id");

    const userRole =
        localStorage.getItem("user_role");


    if (!userId)
    {
        return null;
    }


    return {
        user_id: userId,

        role:
            String(
                userRole || ""
            ).toLowerCase()
    };
}



// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(value)
{
    const div =
        document.createElement("div");


    div.textContent =
        value === undefined ||
        value === null
            ? ""
            : String(value);


    return div.innerHTML;
}



// ============================================================
// LOAD SELLER ORDERS
// ============================================================

async function loadSellerOrders()
{
    const container =
        document.getElementById(
            "ordersContainer"
        );


    const user =
        getLoggedInSeller();


    const sellerId =
        user
            ? user.user_id
            : null;


    // --------------------------------------------------------
    // LOGIN CHECK
    // --------------------------------------------------------

    if (!user || !sellerId)
    {
        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-icon">
                    🔐
                </div>

                <h2>
                    Please Login
                </h2>

                <p>
                    Login as a seller to view your orders.
                </p>

                <a
                    href="login.html"
                    class="primary-btn"
                >
                    Login
                </a>

            </div>

        `;

        return;
    }


    // --------------------------------------------------------
    // SELLER CHECK
    // --------------------------------------------------------

    if (user.role !== "seller")
    {
        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-icon">
                    🚫
                </div>

                <h2>
                    Seller Access Required
                </h2>

                <p>
                    This page is available only for sellers.
                </p>

            </div>

        `;

        return;
    }


    // --------------------------------------------------------
    // LOADING
    // --------------------------------------------------------

    container.innerHTML = `

        <div class="loading-box">

            <p>
                Loading seller orders...
            </p>

        </div>

    `;


    try
    {
        const response =
            await fetch(
                `${API_BASE}/api/orders/seller/${sellerId}`
            );


        if (!response.ok)
        {
            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const data =
            await response.json();


        console.log(
            "Seller Orders API Response:",
            data
        );


        let orders = [];


        if (Array.isArray(data))
        {
            orders = data;
        }
        else if (Array.isArray(data.orders))
        {
            orders = data.orders;
        }
        else if (Array.isArray(data.data))
        {
            orders = data.data;
        }


        displayOrders(orders);

    }
    catch (error)
    {
        console.error(
            "Seller Orders Error:",
            error
        );


        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h2>
                    Unable to Load Orders
                </h2>

                <p class="error-message">
                    ${escapeHTML(error.message)}
                </p>

                <button
                    class="primary-btn"
                    onclick="loadSellerOrders()"
                >
                    Try Again
                </button>

            </div>

        `;
    }
}



// ============================================================
// DISPLAY ORDERS
// ============================================================

function displayOrders(orders)
{
    const container =
        document.getElementById(
            "ordersContainer"
        );


    const summary =
        document.getElementById(
            "ordersSummary"
        );


    // --------------------------------------------------------
    // EMPTY
    // --------------------------------------------------------

    if (!orders || orders.length === 0)
    {
        summary.style.display =
            "none";


        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-icon">
                    📦
                </div>

                <h2>
                    No Orders Yet
                </h2>

                <p>
                    When customers purchase your products,
                    their orders will appear here.
                </p>

            </div>

        `;

        return;
    }


    // --------------------------------------------------------
    // SUMMARY
    // --------------------------------------------------------

    summary.style.display =
        "grid";


    let productsSold = 0;

    let totalSales = 0;


    orders.forEach(order =>
    {
        if (!Array.isArray(order.items))
        {
            return;
        }


        order.items.forEach(item =>
        {
            const quantity =
                Number(
                    item.quantity || 0
                );


            const price =
                Number(
                    item.price || 0
                );


            productsSold +=
                quantity;


            totalSales +=
                price * quantity;
        });
    });


    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "productsSold"
    ).textContent =
        productsSold;


    document.getElementById(
        "totalSales"
    ).textContent =
        `₹${totalSales.toFixed(2)}`;



    // --------------------------------------------------------
    // ORDER CARDS
    // --------------------------------------------------------

    container.innerHTML =
        orders.map(order =>
        {

            const orderId =
                order.order_id ??
                "N/A";


            const date =
                order.created_at
                    ? new Date(
                        order.created_at
                    ).toLocaleString()
                    : "Date unavailable";


            const items =
                Array.isArray(order.items)
                    ? order.items
                    : [];


            const customerName =
                order.customer_name ||
                "Customer";


            const customerEmail =
                order.customer_email ||
                "";


            const customerMobile =
                order.customer_mobile ||
                "";


            const deliveryName =
                order.delivery_name ||
                customerName;


            const deliveryMobile =
                order.delivery_mobile ||
                customerMobile;


            const deliveryAddress =
                order.delivery_address ||
                "";


            const deliveryCity =
                order.delivery_city ||
                "";


            const deliveryPincode =
                order.delivery_pincode ||
                "";


            // ------------------------------------------------
            // ITEMS
            // ------------------------------------------------

            let itemsHTML = "";


            if (items.length === 0)
            {
                itemsHTML = `

                    <p
                        style="
                            padding:20px 0;
                            color:#888;
                        "
                    >
                        No item details available.
                    </p>

                `;
            }
            else
            {
                itemsHTML =
                    items.map(item =>
                    {

                        const productName =
                            item.product_name ||
                            "Product";


                        const quantity =
                            Number(
                                item.quantity || 0
                            );


                        const price =
                            Number(
                                item.price || 0
                            );


                        const subtotal =
                            Number(
                                item.subtotal ??
                                price * quantity
                            );


                        const status =
                            String(
                                item.status ||
                                "Pending"
                            );


                        const isDelivered =
                            status.toLowerCase() ===
                            "delivered";


                        const imagePath =
                            item.image_path || "";


                        let imageHTML = "";


                        if (imagePath)
                        {
                            imageHTML = `

                                <img
                                    src="${escapeHTML(
                                        imagePath
                                    )}"
                                    class="item-image"
                                    alt="${escapeHTML(
                                        productName
                                    )}"
                                    onerror="
                                        this.style.display='none';
                                    "
                                >

                            `;
                        }
                        else
                        {
                            imageHTML = `

                                <div
                                    class="item-image"
                                    style="
                                        display:flex;
                                        align-items:center;
                                        justify-content:center;
                                        font-size:28px;
                                    "
                                >
                                    📦
                                </div>

                            `;
                        }


                        return `

                            <div
                                class="seller-order-item"
                                id="item-${item.order_item_id}"
                            >

                                <div class="item-left">

                                    ${imageHTML}


                                    <div class="item-info">

                                        <h3>
                                            ${escapeHTML(
                                                productName
                                            )}
                                        </h3>


                                        <p>
                                            Quantity:
                                            <strong>
                                                ${quantity}
                                            </strong>

                                            &nbsp; × &nbsp;

                                            ₹${price.toFixed(2)}
                                        </p>


                                        <p>
                                            Order Item ID:
                                            <strong>
                                                ${escapeHTML(
                                                    item.order_item_id
                                                )}
                                            </strong>
                                        </p>

                                    </div>

                                </div>


                                <div class="item-action">

                                    <span class="status-label">
                                        Delivery Status
                                    </span>


                                    <span
                                        class="
                                            item-status
                                            ${isDelivered
                                                ? "delivered"
                                                : "pending"}
                                        "
                                    >

                                        ${isDelivered
                                            ? "✓ Delivered"
                                            : "Pending"}

                                    </span>


                                    ${
                                        isDelivered
                                        ?

                                        `
                                            <button
                                                class="deliver-btn"
                                                disabled
                                            >
                                                ✓ Delivered
                                            </button>
                                        `

                                        :

                                        `
                                            <button
                                                class="deliver-btn"
                                                onclick="
                                                    markItemDelivered(
                                                        ${Number(
                                                            item.order_item_id
                                                        )}
                                                    )
                                                "
                                            >
                                                Mark as Delivered
                                            </button>
                                        `
                                    }

                                </div>


                                <div class="item-price">

                                    ₹${subtotal.toFixed(2)}

                                </div>

                            </div>

                        `;

                    }).join("");
            }



            // ------------------------------------------------
            // COMPLETE ORDER
            // ------------------------------------------------

            return `

                <article
                    class="seller-order-card"
                >

                    <div class="order-top">

                        <div>

                            <h2>
                                Order #${escapeHTML(
                                    orderId
                                )}
                            </h2>


                            <p class="order-date">
                                ${escapeHTML(date)}
                            </p>

                        </div>


                        <span class="order-type">
                            Product-wise delivery
                        </span>

                    </div>



                    <!-- CUSTOMER -->

                    <div class="customer-section">

                        <h3>
                            Customer Details
                        </h3>


                        <div class="customer-info">

                            <span>
                                👤
                                ${escapeHTML(
                                    customerName
                                )}
                            </span>


                            ${
                                customerEmail
                                ?
                                `
                                    <span>
                                        ✉️
                                        ${escapeHTML(
                                            customerEmail
                                        )}
                                    </span>
                                `
                                :
                                ""
                            }


                            ${
                                customerMobile
                                ?
                                `
                                    <span>
                                        📱
                                        ${escapeHTML(
                                            customerMobile
                                        )}
                                    </span>
                                `
                                :
                                ""
                            }

                        </div>


                        ${
                            deliveryAddress ||
                            deliveryCity ||
                            deliveryPincode
                            ?

                            `
                                <div class="delivery-box">

                                    <strong>
                                        Delivery Details
                                    </strong>

                                    <br>

                                    ${escapeHTML(
                                        deliveryName
                                    )}

                                    <br>

                                    ${
                                        deliveryMobile
                                        ?
                                        escapeHTML(
                                            deliveryMobile
                                        )
                                        :
                                        ""
                                    }

                                    <br>

                                    ${escapeHTML(
                                        deliveryAddress
                                    )}

                                    ${
                                        deliveryCity
                                        ?
                                        `, ${escapeHTML(
                                            deliveryCity
                                        )}`
                                        :
                                        ""
                                    }

                                    ${
                                        deliveryPincode
                                        ?
                                        ` - ${escapeHTML(
                                            deliveryPincode
                                        )}`
                                        :
                                        ""
                                    }

                                </div>
                            `

                            :

                            ""
                        }

                    </div>



                    <!-- PRODUCTS -->

                    <div class="order-items">

                        ${itemsHTML}

                    </div>



                    <!-- ORDER TOTAL -->

                    <div class="order-bottom">

                        <span>
                            Order Total
                        </span>


                        <strong>
                            ₹${Number(
                                order.total_amount || 0
                            ).toFixed(2)}
                        </strong>

                    </div>

                </article>

            `;

        }).join("");
}



// ============================================================
// MARK ONE PRODUCT AS DELIVERED
// ============================================================

async function markItemDelivered(
    orderItemId
)
{
    const user =
        getLoggedInSeller();


    if (!user)
    {
        alert(
            "Please login as a seller."
        );

        return;
    }


    if (user.role !== "seller")
    {
        alert(
            "Only sellers can update delivery status."
        );

        return;
    }


    if (!orderItemId)
    {
        alert(
            "Invalid order item."
        );

        return;
    }


    const confirmed =
        confirm(
            "Mark this product as Delivered?"
        );


    if (!confirmed)
    {
        return;
    }


    try
    {
        const response =
            await fetch(
                `${API_BASE}/api/order-items/${orderItemId}/delivered`,
                {
                    method: "PUT",

                    headers:
                    {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                        {
                            seller_id:
                                Number(
                                    user.user_id
                                )
                        })
                }
            );


        const data =
            await response.json();


        console.log(
            "Mark Delivered Response:",
            data
        );


        if (!response.ok ||
            !data.success)
        {
            throw new Error(
                data.message ||
                `HTTP ${response.status}`
            );
        }


        alert(
            "Product marked as Delivered successfully."
        );


        // ----------------------------------------------------
        // Reload seller orders.
        //
        // This makes sure the new status comes directly
        // from PostgreSQL.
        // ----------------------------------------------------

        await loadSellerOrders();

    }
    catch (error)
    {
        console.error(
            "Mark Delivered Error:",
            error
        );


        alert(
            "Could not update delivery status.\n\n" +
            error.message
        );
    }
}



// ============================================================
// PAGE LOAD
// ============================================================

document.addEventListener(
    "DOMContentLoaded",
    function()
    {
        loadSellerOrders();
    }
);

</script>


</body>

</html>
