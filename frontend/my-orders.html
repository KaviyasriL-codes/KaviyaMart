</main>

<script>

    // ============================================================
    // CHECK LOGIN
    // ============================================================

    const userId =
        localStorage.getItem("user_id");

    const userRole =
        localStorage.getItem("user_role");


    if (!userId) {

        window.location.href =
            "login.html";

    }


    if (userRole &&
        userRole.toLowerCase() !== "buyer") {

        alert(
            "Only buyers can view My Orders."
        );

        window.location.href =
            "index.html";

    }


    // ============================================================
    // LOGOUT
    // ============================================================

    document
        .getElementById("logoutBtn")
        .addEventListener("click", function () {

            localStorage.removeItem("user_id");
            localStorage.removeItem("user_name");
            localStorage.removeItem("user_role");

            window.location.href =
                "login.html";

        });


    // ============================================================
    // ELEMENTS
    // ============================================================

    const loading =
        document.getElementById("loading");

    const ordersContainer =
        document.getElementById("ordersContainer");

    const emptyOrders =
        document.getElementById("emptyOrders");

    const errorBox =
        document.getElementById("errorBox");


    // ============================================================
    // LOAD ORDERS
    // ============================================================

    async function loadOrders() {

        try {

            loading.style.display =
                "block";

            ordersContainer.innerHTML = "";

            emptyOrders.style.display =
                "none";

            errorBox.style.display =
                "none";


            const response =
                await fetch(
                    `/api/orders/buyer/${userId}`
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load orders."
                );

            }


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.message ||
                    "Unable to load orders."
                );

            }


            loading.style.display =
                "none";


            if (!data.orders ||
                data.orders.length === 0) {

                emptyOrders.style.display =
                    "block";

                return;

            }


            data.orders.forEach(
                renderOrder
            );

        }
        catch (error) {

            console.error(
                "My Orders Error:",
                error
            );

            loading.style.display =
                "none";

            errorBox.textContent =
                error.message ||
                "Something went wrong while loading your orders.";

            errorBox.style.display =
                "block";

        }

    }


    // ============================================================
    // RENDER ORDER
    // ============================================================

    function renderOrder(order) {

        const orderCard =
            document.createElement("div");

        orderCard.className =
            "order-card";


        const createdDate =
            formatDate(order.created_at);


        const total =
            Number(order.total_amount || 0)
                .toFixed(2);


        let productsHTML = "";


        if (order.items &&
            order.items.length > 0) {

            order.items.forEach(
                item => {

                    productsHTML +=
                        createProductHTML(item);

                }
            );

        }
        else {

            productsHTML = `
                <div style="
                    padding:20px;
                    color:#777;
                    text-align:center;">
                    No products found in this order.
                </div>
            `;

        }


        const deliveryName =
            escapeHTML(
                order.delivery_name || ""
            );

        const deliveryMobile =
            escapeHTML(
                order.delivery_mobile || ""
            );

        const deliveryAddress =
            escapeHTML(
                order.delivery_address || ""
            );

        const deliveryCity =
            escapeHTML(
                order.delivery_city || ""
            );

        const deliveryPincode =
            escapeHTML(
                order.delivery_pincode || ""
            );


        orderCard.innerHTML = `

            <div class="order-header">

                <div class="order-top">

                    <div>

                        <div class="order-id">
                            Order #${order.order_id}
                        </div>

                        <div class="order-date">
                            Placed on ${createdDate}
                        </div>

                        <div class="payment-method">
                            Payment:
                            <strong>
                                ${escapeHTML(
                                    order.payment_method || "COD"
                                )}
                            </strong>
                        </div>

                    </div>


                    <div class="order-total">
                        Total: ₹${total}
                    </div>

                </div>

            </div>


            <div class="products-container">

                ${productsHTML}

            </div>


            <div class="delivery-section">

                <div class="delivery-title">
                    Delivery Details
                </div>

                <div class="delivery-info">

                    <strong>
                        ${deliveryName}
                    </strong>

                    <br>

                    Mobile:
                    ${deliveryMobile}

                    <br>

                    ${deliveryAddress},
                    ${deliveryCity}
                    -
                    ${deliveryPincode}

                </div>

            </div>
        `;


        ordersContainer.appendChild(
            orderCard
        );

    }


    // ============================================================
    // CREATE PRODUCT HTML
    // ============================================================

    function createProductHTML(item) {

        const productName =
            escapeHTML(
                item.product_name ||
                "Product"
            );


        const description =
            escapeHTML(
                item.description ||
                ""
            );


        const quantity =
            Number(item.quantity || 0);


        const price =
            Number(item.price || 0);


        const subtotal =
            item.subtotal !== undefined &&
            item.subtotal !== null
                ? Number(item.subtotal)
                : price * quantity;


        /*
         * IMPORTANT
         *
         * The backend should eventually send:
         *
         * item.status
         *
         * Example:
         *
         * {
         *     "order_item_id": 10,
         *     "product_name": "Watch",
         *     "status": "Delivered"
         * }
         *
         * Until that backend change is made,
         * we safely show Pending.
         */

        const status =
            normalizeStatus(
                item.status
            );


        const statusClass =
            status === "Delivered"
                ? "status-delivered"
                : status === "Pending"
                    ? "status-pending"
                    : "status-unknown";


        const statusIcon =
            status === "Delivered"
                ? "✓"
                : status === "Pending"
                    ? "●"
                    : "•";


        let imageHTML = "";


        if (item.image_path) {

            let imagePath =
                item.image_path;


            /*
             * If backend stores something like:
             *
             * uploads/product.jpg
             *
             * use it directly.
             */

            if (!imagePath.startsWith("/")) {

                imagePath =
                    "/" + imagePath;

            }


            imageHTML = `

                <img
                    src="${escapeAttribute(imagePath)}"
                    alt="${escapeAttribute(productName)}"
                    class="product-image"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                >

                <div
                    class="no-image"
                    style="display:none;">
                    Image unavailable
                </div>

            `;

        }
        else {

            imageHTML = `

                <div class="no-image">
                    No Image
                </div>

            `;

        }


        return `

            <div class="product-card">

                <div class="product-image-wrapper">

                    ${imageHTML}

                </div>


                <div class="product-info">

                    <div class="product-name">
                        ${productName}
                    </div>


                    ${
                        description
                            ? `
                                <div class="product-description">
                                    ${description}
                                </div>
                              `
                            : ""
                    }


                    <div class="product-details">

                        <span>
                            Quantity:
                            <strong>
                                ${quantity}
                            </strong>
                        </span>


                        <span class="product-price">
                            Price:
                            ₹${price.toFixed(2)}
                        </span>


                        <span class="product-subtotal">
                            Subtotal:
                            ₹${subtotal.toFixed(2)}
                        </span>

                    </div>

                </div>


                <div class="item-status-section">

                    <div class="status-label">
                        Delivery Status
                    </div>

                    <div
                        class="item-status ${statusClass}">

                        ${statusIcon}
                        &nbsp;
                        ${status}

                    </div>

                </div>

            </div>

        `;

    }


    // ============================================================
    // NORMALIZE STATUS
    // ============================================================

    function normalizeStatus(status) {

        if (!status) {

            return "Pending";

        }


        const value =
            String(status)
                .trim()
                .toLowerCase();


        if (value === "delivered") {

            return "Delivered";

        }


        if (value === "pending") {

            return "Pending";

        }


        return "Pending";

    }


    // ============================================================
    // FORMAT DATE
    // ============================================================

    function formatDate(dateValue) {

        if (!dateValue) {

            return "Date unavailable";

        }


        const date =
            new Date(dateValue);


        if (Number.isNaN(
            date.getTime()
        )) {

            return escapeHTML(
                String(dateValue)
            );

        }


        return date.toLocaleString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    // ============================================================
    // HTML ESCAPING
    // ============================================================

    function escapeHTML(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function escapeAttribute(value) {

        return escapeHTML(value);

    }


    // ============================================================
    // START
    // ============================================================

    loadOrders();

</script>

</body>
